# Retrolaunch: заголовки для всех ответов поддомена.
# Подключается в каждом location с add_header: иначе nginx не наследует заголовки сервера.

# Порты с потоками (The Ur-Quan Masters) требуют SharedArrayBuffer, а он есть только у изолированной страницы.
# credentialless, в отличие от require-corp, не ломает загрузку шрифтов Google.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header X-Content-Type-Options "nosniff" always;
