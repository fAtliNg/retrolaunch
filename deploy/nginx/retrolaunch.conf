# Retrolaunch — старые игры в браузере: https://retrolaunch.denisenkosergey.ru
# Статическая сборка Vite в /var/www/retrolaunch. Сертификат и редирект на HTTPS добавляет certbot.
server {
    server_name retrolaunch.denisenkosergey.ru;

    root /var/www/retrolaunch;
    index index.html;

    include snippets/retrolaunch-headers.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/wasm image/svg+xml;

    # nginx 1.18 не знает тип .wasm, а браузер компилирует WebAssembly потоково только с application/wasm
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        include snippets/retrolaunch-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        include snippets/retrolaunch-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Эмуляторы, пакеты игр, обложки, каталог: файлов нет — честный 404, а не страница сайта
    location ~ ^/(engines|bundles|covers|vendor|data)/ {
        include snippets/retrolaunch-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        include snippets/retrolaunch-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Маршруты React Router (/games/doom и т. п.) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/retrolaunch.denisenkosergey.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/retrolaunch.denisenkosergey.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = retrolaunch.denisenkosergey.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name retrolaunch.denisenkosergey.ru;
    return 404; # managed by Certbot


}