<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colossal Cave Adventure</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #050805;
        color: #7dff8a;
        font: 16px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        text-shadow: 0 0 6px rgba(125, 255, 138, 0.35);
      }
      #term {
        box-sizing: border-box;
        height: 100%;
        overflow-y: auto;
        padding: 20px 24px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #line { display: flex; gap: 0.5ch; }
      #input {
        flex: 1;
        border: 0;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
        text-shadow: inherit;
        caret-color: #7dff8a;
        padding: 0;
      }
      .echo { color: #c8ffd0; }
    </style>
  </head>
  <body>
    <!-- Retrolaunch: простой терминал для Open Adventure. Вывод игры — сверху, ввод — последняя строка. -->
    <div id="term"><span id="out"></span><div id="line"><span id="prompt"></span><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command" /></div></div>
    <script>
      const outEl = document.getElementById('out')
      const termEl = document.getElementById('term')
      const inputEl = document.getElementById('input')
      const promptEl = document.getElementById('prompt')
      let pending = null

      const write = (text, cls) => {
        const span = document.createElement('span')
        if (cls) span.className = cls
        span.textContent = text
        outEl.append(span)
        termEl.scrollTop = termEl.scrollHeight
      }

      document.addEventListener('click', () => inputEl.focus())
      inputEl.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || !pending) return
        const line = inputEl.value
        inputEl.value = ''
        write(promptEl.textContent)
        write(line + '\n', 'echo')
        promptEl.textContent = ''
        const resolve = pending
        pending = null
        // Сохранения игры лежат в IndexedDB — сбрасываем их туда после каждой команды
        FS.syncfs(false, () => resolve(line))
      })

      var Module = {
        print: (text) => write(text + '\n'),
        printErr: (text) => console.warn(text),
        retroReadLine: (prompt) =>
          new Promise((resolve) => {
            promptEl.textContent = prompt
            pending = resolve
            inputEl.focus()
            termEl.scrollTop = termEl.scrollHeight
          }),
        preRun: [
          () => {
            FS.mkdir('/saves')
            FS.mount(IDBFS, {}, '/saves')
            FS.chdir('/saves')
            addRunDependency('syncfs')
            FS.syncfs(true, () => removeRunDependency('syncfs'))
          },
        ],
        onExit: () => {
          // SAVE завершает игру сразу после записи файла — досинхронизируем его в IndexedDB
          FS.syncfs(false, () => {})
          write('\n[The game has ended. Reload the page to play again.]\n')
        },
      }
    </script>
    <script src="advent.js"></script>
  </body>
</html>
